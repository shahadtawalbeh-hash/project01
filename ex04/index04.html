<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
</head>
<body>

<form>
<label for= "fullname">Full Name </label>
<input type= "text" id="fullname" name="fullname" required minlength="3"><br>

<label for= "email">Email </label>
<input type= "email" id="email" name="email" required><br>



<label for= "password">Password </label>
<input type= "password" id="password" name="password" required minlength="8"><br>

<label>Gender</label>

<input type= "radio" id="male" name="Gender" value="male">
<label for="male"> Male</label>

<input type= "radio" id="female" name="Gender" value="female">
<label for="female"> Female</label>
<br>

<label for= "agreement"> 
<input type= "checkbox" id="agreement" name="agreement" required>
I agree to the terms and conditions 
</label>
<br>
 <label for="country">Country</label>
 <select id="country" name="country" required>
 <option value="">Select a country</option>
 <option value="jordan">Jordan</option>
 <option value="palestine">Palestine</option>
 <option value="saudi-arabia">Saudi Arabia</option>
 </select>
<br>

 <label for="message">About You</label>
 <textarea id="message" name="message" minlength="10"></textarea>
<br>
 <button type="submit">Register</button>

</form>

</body>
</html>
